<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- gknowledge app icon: an open notebook whose pages hold a small knowledge
       graph. Drawn on the 128 px GNOME app icon grid with the GNOME palette:
       object seen slightly from above, flat fills, darker bottom edge. -->
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ebeae8"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ebeae8"/>
    </linearGradient>
  </defs>

  <!-- cover: bottom edge, then face -->
  <rect x="8" y="30" width="112" height="86" rx="12" fill="#1a5fb4"/>
  <rect x="8" y="26" width="112" height="84" rx="12" fill="url(#cover)"/>

  <!-- page block thickness -->
  <path d="M16 34 Q40 28 64 36 Q88 28 112 34 V102 Q88 96 64 104 Q40 96 16 102 Z" fill="#c0bfbc"/>
  <path d="M16 31 Q40 25 64 33 Q88 25 112 31 V98 Q88 92 64 100 Q40 92 16 98 Z" fill="#deddda"/>

  <!-- pages -->
  <path d="M16 28 Q40 22 64 30 V96 Q40 88 16 94 Z" fill="url(#pageL)"/>
  <path d="M112 28 Q88 22 64 30 V96 Q88 88 112 94 Z" fill="url(#pageR)"/>
  <path d="M64 30 V96" stroke="#c0bfbc" stroke-width="2" stroke-linecap="round"/>

  <!-- text lines -->
  <g stroke="#deddda" stroke-width="3" stroke-linecap="round">
    <path d="M24 80 Q36 77 50 80"/>
    <path d="M24 87 Q34 84.5 44 87"/>
    <path d="M78 80 Q92 77 104 80"/>
  </g>

  <!-- knowledge graph across the pages -->
  <g stroke="#99c1f1" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M36 50 L52 66"/>
    <path d="M36 50 L84 46"/>
    <path d="M52 66 L84 46"/>
    <path d="M84 46 L96 66"/>
  </g>
  <circle cx="36" cy="50" r="7" fill="#3584e4"/>
  <circle cx="52" cy="66" r="5.5" fill="#62a0ea"/>
  <circle cx="84" cy="46" r="8" fill="#ff7800"/>
  <circle cx="84" cy="46" r="3" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="96" cy="66" r="5.5" fill="#3584e4"/>
</svg>
