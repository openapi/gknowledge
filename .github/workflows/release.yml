name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: build-aux/deb/build-deb.sh dist
      # Version-independent names so /releases/latest/download/<name> always works.
      - run: |
          cp dist/gknowledge_*_all.deb dist/gknowledge_all.deb
          cp install.sh dist/install.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gknowledge_*_all.deb
            dist/gknowledge_all.deb
            dist/install.sh
          body_path: build-aux/release-notes.md
          generate_release_notes: true
  flatpak-bundle:
    needs: deb          # avoid two jobs racing to create the same release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//51 org.gnome.Sdk//51
      - name: Build and verify Flatpak bundle
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir build-aux/flatpak/io.gknowledge.Gknowledge.yaml
          bundle="gknowledge-${GITHUB_REF_NAME}.flatpak"
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo repo "$bundle" io.gknowledge.Gknowledge
          test -s "$bundle"
          flatpak install --user --noninteractive --bundle "$bundle"
          flatpak info --user io.gknowledge.Gknowledge
      - uses: softprops/action-gh-release@v2
        with:
          files: gknowledge-*.flatpak
